
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#681b24">
  <title>ประกาศรายชื่อผู้ได้รับรางวัล | TUH 2026</title>

  <style>
    :root {
      --wine: #681b24;
      --wine-dark: #350d16;
      --gold: #f3cf79;
      --gold-light: #fff0bd;
      --cream: #fffaf0;
      --ink: #3b2020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(243, 207, 121, .2), transparent 50%),
        linear-gradient(145deg, var(--wine), var(--wine-dark));
      overflow-x: hidden;
    }

    .page {
      width: min(1050px, calc(100% - 30px));
      margin: auto;
      padding: 30px 0;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: .12em;
      font-size: 15px;
      margin: 0 0 8px;
    }

    h1 {
      color: var(--gold-light);
      font-size: clamp(25px, 4vw, 42px);
      margin: 0;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .3);
    }

    .subtitle {
      font-size: 16px;
      margin: 8px 0;
      color: #fff4df;
    }

    .ornament {
      color: var(--gold);
      margin: 12px;
      letter-spacing: 10px;
    }

    /* ข้อมูลสรุป */
    .info-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 15px 0 22px;
    }

    .info-chip {
      padding: 9px 20px;
      border: 1px solid rgba(243, 207, 121, .55);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: var(--gold-light);
      font-size: 15px;
    }

    .info-chip strong {
      color: white;
      margin-left: 5px;
    }

    /* กล่องรายชื่อ */
    .scroll-window {
      height: min(68vh, 750px);
      min-height: 350px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(243, 207, 121, .7);
      border-radius: 18px;
      background: rgba(255, 250, 240, .06);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .25);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 3%, black 97%, transparent);
      mask-image: linear-gradient(to bottom, transparent, black 3%, black 97%, transparent);
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
      animation: scrollUp linear infinite;
      animation-duration: 100s;
    }

    @keyframes scrollUp {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-50%);
      }
    }

    /* รายชื่อแต่ละชุด */
    .winner-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px 16px;
    }

    /* หนึ่งคนต่อหนึ่งแถว */
    .winner-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 13px 18px;
      min-height: 78px;
      border: 1px solid rgba(243, 207, 121, .65);
      border-radius: 12px;
      background: linear-gradient(110deg,
          #fffaf0,
          #ffedc7);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .13);
    }

    .number {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffe9a6, #d9a94f);
      color: var(--wine-dark);
      font-weight: 900;
      font-size: 16px;
    }

    .winner-main {
      min-width: 0;
    }

    .winner-name {
      font-size: clamp(17px, 2vw, 21px);
      font-weight: 800;
      line-height: 1.4;
      color: #511720;
      overflow-wrap: anywhere;
    }

    .winner-detail {
      margin-top: 3px;
      color: #76594c;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .winner-prize {
      text-align: right;
      color: #895b1f;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      padding-left: 8px;
    }

    .empty,
    .error {
      text-align: center;
      padding: 40px 20px;
      line-height: 1.8;
    }

    /* ปุ่มควบคุม */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 10px 20px;
      color: var(--wine-dark);
      background: linear-gradient(135deg, #ffedb6, #d9a94f);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, filter .2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    button.secondary {
      color: var(--cream);
      background: transparent;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: rgba(255, 240, 189, .85);
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: rgba(255, 240, 189, .8);
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .page {
        padding-top: 20px;
      }

      .scroll-window {
        height: 65vh;
        min-height: 330px;
      }

      .winner-list {
        padding: 9px;
        gap: 8px;
      }

      .winner-row {
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 10px;
        padding: 11px;
      }

      .number {
        width: 34px;
        height: 34px;
        font-size: 13px;
      }

      .winner-name {
        font-size: 17px;
      }

      .winner-prize {
        grid-column: 2;
        text-align: left;
        padding-left: 0;
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-track {
        animation-play-state: paused;
      }
    }

    /* สำหรับพิมพ์รายชื่อ */
    @media print {
      body {
        background: white;
        color: black;
      }

      .controls,
      .status {
        display: none !important;
      }

      .page {
        width: 100%;
        padding: 0;
      }

      h1,
      .subtitle,
      .eyebrow,
      footer {
        color: black;
        text-shadow: none;
      }

      .scroll-window {
        height: auto;
        min-height: 0;
        overflow: visible;
        border: none;
        background: white;
        mask-image: none;
        -webkit-mask-image: none;
      }

      .scroll-track {
        animation: none !important;
        transform: none !important;
      }

      .winner-list[aria-hidden="true"] {
        display: none !important;
      }

      .winner-row {
        break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <p class="eyebrow">LUCKY DRAW · TUH 2026</p>
      <h1>ประกาศรายชื่อผู้ได้รับรางวัล</h1>
      <p class="subtitle">
        งานเลี้ยงส่งท้ายปีเก่า ต้อนรับปีใหม่ ประจำปี 2569
      </p>
      <div class="ornament">✧ ✦ ✧</div>
    </header>

    <div class="info-bar">
      <div class="info-chip" id="countPanel">
        ผู้ได้รับรางวัล <strong>0 คน</strong>
      </div>

      <div class="info-chip" id="prizePanel">
        มูลค่ารางวัล <strong>-</strong>
      </div>
    </div>

    <section class="scroll-window" id="scrollWindow">
      <div class="scroll-track" id="scrollTrack"></div>
    </section>

    <div class="controls">
      <button type="button" id="pauseBtn">⏸ หยุดเลื่อน</button>
      <button type="button" class="secondary" id="slowerBtn">− ช้าลง</button>
      <button type="button" class="secondary" id="fasterBtn">+ เร็วขึ้น</button>
      <button type="button" class="secondary" onclick="window.print()">พิมพ์รายชื่อ</button>
      <button type="button" class="secondary" onclick="window.close()">ปิดหน้านี้</button>
    </div>

    <div class="status" id="statusText">
      กำลังแสดงรายชื่อผู้ได้รับรางวัล
    </div>

    <footer>
      ขอแสดงความยินดีกับผู้ได้รับรางวัลทุกท่าน
    </footer>

  </main>

  <script>
    let currentSpeed = 18;
    let isPaused = false;
    let isHovering = false;
    let canScroll = false;

    const track = document.getElementById("scrollTrack");
    const scrollWindow = document.getElementById("scrollWindow");
    const pauseBtn = document.getElementById("pauseBtn");
    const statusText = document.getElementById("statusText");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatMoney(value) {
      const number = Number(String(value ?? "").replace(/,/g, ""));
      if (!Number.isFinite(number)) return escapeHTML(value);

      return number.toLocaleString("th-TH") + " บาท";
    }

    function createWinnerRows(winners) {
      return winners.map((person, index) => {
        const fullName = [
          person.firstName,
          person.lastName
        ].filter(Boolean).join(" ") || "ไม่พบชื่อ";

        const details = [
          person.position,
          person.division ? "สังกัด " + person.division : "",
          person.department ? "หน่วยงาน " + person.department : ""
        ].filter(Boolean).join(" · ");

        const prizeName = person.prize || "";
        const prizeValue = person.prizeValue;

        let prizeText = "";

        if (prizeName && prizeValue !== undefined && prizeValue !== null && prizeValue !== "") {
          prizeText = "🎁 " + prizeName + " · " + formatMoney(prizeValue);
        } else if (prizeName) {
          prizeText = "🎁 " + prizeName;
        } else if (prizeValue !== undefined && prizeValue !== null && prizeValue !== "") {
          prizeText = "🎁 " + formatMoney(prizeValue);
        }

        return `
          <article class="winner-row">
            <div class="number">${index + 1}</div>

            <div class="winner-main">
              <div class="winner-name">
                ${escapeHTML(fullName)}
              </div>

              ${details ? `
                <div class="winner-detail">
                  ${escapeHTML(details)}
                </div>
              ` : ""}
            </div>

            ${prizeText ? `
              <div class="winner-prize">
                ${escapeHTML(prizeText)}
              </div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    function updateSpeed() {
      const firstList = track.querySelector(".winner-list");
      if (!firstList) return;

      const contentHeight = firstList.offsetHeight;

      // ถ้ารายชื่อไม่ยาวกว่าพื้นที่แสดงผล ไม่ต้องเลื่อน
      canScroll = contentHeight > scrollWindow.clientHeight;

      if (canScroll) {
        track.style.animationDuration =
          (contentHeight / currentSpeed) + "s";

        track.style.animationPlayState =
          (isPaused || isHovering) ? "paused" : "running";

        statusText.textContent =
          "กำลังเลื่อนรายชื่อ · ความเร็ว " +
          currentSpeed + " px/วินาที";
      } else {
        track.style.animation = "none";
        track.style.transform = "none";
        statusText.textContent = "แสดงรายชื่อครบทุกท่าน";
      }
    }

    function setPaused(paused) {
      isPaused = paused;

      pauseBtn.textContent = paused
        ? "▶ เล่นต่อ"
        : "⏸ หยุดเลื่อน";

      if (canScroll) {
        track.style.animationPlayState =
          (isPaused || isHovering) ? "paused" : "running";
      }

      if (paused) {
        statusText.textContent = "หยุดแสดงรายชื่อชั่วคราว";
      } else {
        updateSpeed();
      }
    }

    pauseBtn.addEventListener("click", () => {
      setPaused(!isPaused);
    });

    document.getElementById("slowerBtn").addEventListener("click", () => {
      currentSpeed = Math.max(6, currentSpeed - 4);
      updateSpeed();
    });

    document.getElementById("fasterBtn").addEventListener("click", () => {
      currentSpeed = Math.min(60, currentSpeed + 4);
      updateSpeed();
    });

    scrollWindow.addEventListener("mouseenter", () => {
      isHovering = true;
      if (canScroll) {
        track.style.animationPlayState = "paused";
      }
    });

    scrollWindow.addEventListener("mouseleave", () => {
      isHovering = false;
      if (canScroll) {
        track.style.animationPlayState =
          isPaused ? "paused" : "running";
      }
    });

    function loadWinners() {
      const countPanel = document.getElementById("countPanel");
      const prizePanel = document.getElementById("prizePanel");

      let winners;

      try {
        winners = JSON.parse(
          sessionStorage.getItem("creditData") || "null"
        );
      } catch (error) {
        track.innerHTML =
          '<div class="error">ไม่สามารถอ่านข้อมูลรายชื่อผู้ได้รับรางวัลได้</div>';
        return;
      }

      if (!Array.isArray(winners) || winners.length === 0) {
        track.innerHTML =
          '<div class="empty">ไม่พบข้อมูลผู้ได้รับรางวัล กรุณากลับไปหน้าจับรางวัลแล้วเปิดหน้าเครดิตอีกครั้ง</div>';
        return;
      }

      countPanel.innerHTML =
        'ผู้ได้รับรางวัล <strong>' +
        winners.length.toLocaleString("th-TH") +
        ' คน</strong>';

      const prizeValue = winners[0].prizeValue;

      if (prizeValue !== undefined && prizeValue !== null && prizeValue !== "") {
        prizePanel.innerHTML =
          'มูลค่ารางวัล <strong>' +
          formatMoney(prizeValue) +
          '</strong>';
      } else {
        prizePanel.style.display = "none";
      }

      const rows = createWinnerRows(winners);

      // ทำรายชื่อ 2 ชุด เพื่อเลื่อนวนแบบต่อเนื่อง
      track.innerHTML = `
        <div class="winner-list">
          ${rows}
        </div>

        <div class="winner-list" aria-hidden="true">
          ${rows}
        </div>
      `;

      requestAnimationFrame(updateSpeed);
    }

    window.addEventListener("resize", updateSpeed);

    loadWinners();
  </script>
</body>

</html>
