<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#681b24">
  <title>ประกาศรายชื่อผู้ได้รับรางวัล | งานเลี้ยงปีใหม่ 2569</title>

  <style>
    :root {
      --wine: #681b24;
      --wine-dark: #350d16;
      --gold: #f3cf79;
      --gold-light: #fff0bd;
      --cream: #fffaf0;
      --ink: #3b2020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(243, 207, 121, .22), transparent 48%),
        linear-gradient(145deg, var(--wine), var(--wine-dark));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "✦";
      position: fixed;
      color: rgba(255, 226, 157, .13);
      font-size: clamp(140px, 28vw, 360px);
      pointer-events: none;
      line-height: 1;
      z-index: 0;
    }

    body::before {
      top: -55px;
      left: -35px;
    }

    body::after {
      right: -35px;
      bottom: -95px;
    }

    .page {
      width: min(1300px, calc(100% - 32px));
      margin: auto;
      padding: 30px 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: .12em;
      font-size: clamp(12px, 2vw, 17px);
      margin: 0 0 8px;
    }

    h1 {
      color: var(--gold-light);
      font-size: clamp(25px, 4.5vw, 44px);
      line-height: 1.3;
      margin: 0;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .3);
    }

    .subtitle {
      font-size: clamp(14px, 2vw, 19px);
      margin: 8px 0 0;
      color: #fff4df;
    }

    .ornament {
      color: var(--gold);
      margin: 12px auto;
      letter-spacing: 12px;
    }

    .info-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 18px;
    }

    .info-chip {
      padding: 8px 17px;
      border: 1px solid rgba(243, 207, 121, .55);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: var(--gold-light);
      font-size: clamp(13px, 1.8vw, 17px);
    }

    .info-chip strong {
      color: white;
      margin-left: 5px;
    }

    /* พื้นที่เลื่อนรายชื่อ */

    .scroll-window {
      height: min(66vh, 720px);
      min-height: 350px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(243, 207, 121, .65);
      border-radius: 20px;
      background: rgba(255, 250, 240, .055);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .24);
      -webkit-mask-image: linear-gradient(to bottom,
          transparent,
          black 5%,
          black 95%,
          transparent);
      mask-image: linear-gradient(to bottom,
          transparent,
          black 5%,
          black 95%,
          transparent);
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
      animation: scrollUp linear infinite;
      animation-duration: 300s;
      animation-play-state: running;
    }

    @keyframes scrollUp {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-50%);
      }
    }

    .winner-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 14px 24px;
    }

    .winner-card {
      position: relative;
      overflow: hidden;
      padding: 13px 17px;
      border: 1px solid rgba(243, 207, 121, .72);
      border-radius: 14px;
      background: linear-gradient(135deg,
          rgba(255, 250, 240, .99),
          rgba(255, 237, 199, .97));
      color: var(--ink);
      box-shadow: 0 5px 16px rgba(0, 0, 0, .15);
      min-width: 0;
    }

    .winner-card::after {
      content: "✦";
      position: absolute;
      right: 10px;
      top: 0;
      color: rgba(160, 103, 30, .13);
      font-size: 45px;
      pointer-events: none;
    }

    .winner-top {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 5px;
      color: #87551e;
      font-size: 13px;
      font-weight: 700;
    }

    .number {
      width: 27px;
      height: 27px;
      flex-shrink: 0;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--wine-dark);
      background: linear-gradient(135deg, #ffe9a6, #d9a94f);
      font-weight: 800;
      font-size: 12px;
    }

    .winner-name {
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.4;
      font-weight: 800;
      color: #511720;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 1;
    }

    .winner-detail {
      margin-top: 4px;
      font-size: clamp(12px, 1.4vw, 14px);
      line-height: 1.5;
      color: #674d43;
      overflow-wrap: anywhere;
    }

    .winner-prize {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px solid rgba(104, 27, 36, .16);
      color: #895b1f;
      font-size: 14px;
      font-weight: 800;
    }

    .empty,
    .error {
      text-align: center;
      padding: 40px 20px;
      border: 1px solid rgba(243, 207, 121, .6);
      border-radius: 16px;
      background: rgba(255, 255, 255, .09);
      line-height: 1.8;
      margin: 20px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 10px 20px;
      color: var(--wine-dark);
      background: linear-gradient(135deg, #ffedb6, #d9a94f);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, filter .2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    button.secondary {
      color: var(--cream);
      background: transparent;
    }

    .speed-label {
      color: var(--gold-light);
      font-size: 13px;
      margin-left: 5px;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      color: rgba(255, 240, 189, .8);
      font-size: 13px;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: rgba(255, 240, 189, .78);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .page {
        padding-top: 22px;
      }

      .winner-grid {
        grid-template-columns: 1fr;
        gap: 9px;
        padding: 10px 10px 20px;
      }

      .scroll-window {
        height: 65vh;
        min-height: 330px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-track {
        animation-play-state: paused;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      body::before,
      body::after,
      .controls,
      .status {
        display: none !important;
      }

      .page {
        width: 100%;
        padding: 0;
      }

      h1,
      .subtitle,
      .eyebrow,
      footer {
        color: black;
        text-shadow: none;
      }

      .scroll-window {
        height: auto;
        min-height: 0;
        overflow: visible;
        border: none;
        background: white;
        mask-image: none;
        -webkit-mask-image: none;
      }

      .scroll-track {
        animation: none !important;
        transform: none !important;
      }

      .winner-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .winner-grid:nth-child(2) {
        display: none !important;
      }

      .winner-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <p class="eyebrow">LUCKY DRAW · TUH 2026</p>
      <h1>ประกาศรายชื่อผู้ได้รับรางวัล</h1>
      <p class="subtitle">งานเลี้ยงส่งท้ายปีเก่า ต้อนรับปีใหม่ ประจำปี 2569</p>
      <div class="ornament">✧ ✦ ✧</div>
    </header>

    <div class="info-bar">
      <div class="info-chip" id="countPanel">
        ผู้ได้รับรางวัล <strong>0 คน</strong>
      </div>
      <div class="info-chip" id="prizePanel">
        มูลค่ารางวัล <strong>-</strong>
      </div>
    </div>

    <section class="scroll-window" id="scrollWindow">
      <div class="scroll-track" id="scrollTrack"></div>
    </section>

    <div class="controls">
      <button type="button" id="pauseBtn">⏸ หยุดเลื่อน</button>
      <button type="button" class="secondary" id="slowerBtn">− ช้าลง</button>
      <button type="button" class="secondary" id="fasterBtn">+ เร็วขึ้น</button>
      <button type="button" class="secondary" onclick="window.print()">พิมพ์รายชื่อ</button>
      <button type="button" class="secondary" onclick="window.close()">ปิดหน้านี้</button>
    </div>

    <div class="status" id="statusText">
      กำลังแสดงรายชื่อผู้ได้รับรางวัล
    </div>

    <footer>
      ขอแสดงความยินดีกับผู้ได้รับรางวัลทุกท่าน
    </footer>

  </main>

  <script>
    let currentSpeed = 22; // ความเร็วเริ่มต้น หน่วยพิกเซลต่อวินาที
    let isPaused = false;

    const track = document.getElementById("scrollTrack");
    const scrollWindow = document.getElementById("scrollWindow");
    const pauseBtn = document.getElementById("pauseBtn");
    const statusText = document.getElementById("statusText");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatMoney(value) {
      const number = Number(String(value ?? "").replace(/,/g, ""));
      if (!Number.isFinite(number)) return escapeHTML(value);
      return number.toLocaleString("th-TH") + " บาท";
    }

    function createWinnerCards(winners) {
      return winners.map((person, index) => {
        const fullName = [
          person.firstName,
          person.lastName
        ].filter(Boolean).join(" ") || "ไม่พบชื่อ";

        const details = [
          person.position,
          person.division ? "สังกัด " + person.division : "",
          person.department ? "หน่วยงาน " + person.department : ""
        ].filter(Boolean).join(" · ");

        const prizeValue = person.prizeValue;

        return `
          <article class="winner-card">
            <div class="winner-top">
              <span class="number">${index + 1}</span>
              <span>ผู้โชคดี</span>
            </div>

            <div class="winner-name">
              ${escapeHTML(fullName)}
            </div>

            ${details ? `
              <div class="winner-detail">
                ${escapeHTML(details)}
              </div>
            ` : ""}

            ${prizeValue !== undefined && prizeValue !== null && prizeValue !== "" ? `
              <div class="winner-prize">
                🎁 ได้รับรางวัล ${formatMoney(prizeValue)}
              </div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    function updateSpeed() {
      const firstList = track.querySelector(".winner-grid");
      if (!firstList) return;

      const contentHeight = firstList.offsetHeight;
      const duration = contentHeight / currentSpeed;

      track.style.animationDuration = duration + "s";
      track.style.animationPlayState = isPaused ? "paused" : "running";

      statusText.textContent =
        "กำลังเลื่อนรายชื่อ · ความเร็ว " + currentSpeed + " px/วินาที";
    }

    function setPaused(paused) {
      isPaused = paused;
      track.style.animationPlayState = paused ? "paused" : "running";
      pauseBtn.textContent = paused ? "▶ เล่นต่อ" : "⏸ หยุดเลื่อน";

      if (paused) {
        statusText.textContent = "หยุดแสดงรายชื่อชั่วคราว";
      } else {
        updateSpeed();
      }
    }

    pauseBtn.addEventListener("click", () => {
      setPaused(!isPaused);
    });

    document.getElementById("slowerBtn").addEventListener("click", () => {
      currentSpeed = Math.max(6, currentSpeed - 4);
      updateSpeed();
    });

    document.getElementById("fasterBtn").addEventListener("click", () => {
      currentSpeed = Math.min(60, currentSpeed + 4);
      updateSpeed();
    });

    // เลื่อนเมาส์ไปบนรายชื่อเพื่อหยุดชั่วคราว
    scrollWindow.addEventListener("mouseenter", () => {
      track.style.animationPlayState = "paused";
    });

    scrollWindow.addEventListener("mouseleave", () => {
      track.style.animationPlayState = isPaused ? "paused" : "running";
    });

    function loadWinners() {
      const countPanel = document.getElementById("countPanel");
      const prizePanel = document.getElementById("prizePanel");

      let winners;

      try {
        winners = JSON.parse(
          sessionStorage.getItem("creditData") || "null"
        );
      } catch (error) {
        scrollWindow.innerHTML =
          '<div class="error">ไม่สามารถอ่านข้อมูลรายชื่อผู้ได้รับรางวัลได้</div>';
        return;
      }

      if (!Array.isArray(winners) || winners.length === 0) {
        scrollWindow.innerHTML =
          '<div class="empty">ไม่พบข้อมูลผู้ได้รับรางวัล กรุณากลับไปหน้าจับรางวัลแล้วเปิดหน้าเครดิตอีกครั้ง</div>';
        return;
      }

      countPanel.innerHTML =
        'ผู้ได้รับรางวัล <strong>' +
        winners.length.toLocaleString("th-TH") +
        ' คน</strong>';

      const prizeValue = winners[0].prizeValue;

      if (prizeValue !== undefined && prizeValue !== null && prizeValue !== "") {
        prizePanel.innerHTML =
          'มูลค่ารางวัล <strong>' +
          formatMoney(prizeValue) +
          '</strong>';
      } else {
        prizePanel.style.display = "none";
      }

      // สร้างรายชื่อ 2 ชุดเพื่อให้เลื่อนวนต่อเนื่อง
      const cards = createWinnerCards(winners);

      track.innerHTML = `
        <div class="winner-grid">
          ${cards}
        </div>
        <div class="winner-grid" aria-hidden="true">
          ${cards}
        </div>
      `;

      requestAnimationFrame(() => {
        updateSpeed();
      });
    }

    window.addEventListener("resize", updateSpeed);

    loadWinners();
  </script>
</body>

</html>
